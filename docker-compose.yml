version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mtmi
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/mtmi
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - postgres

  frontend:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./admin:/usr/share/nginx/html/admin
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads: 