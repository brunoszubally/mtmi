<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTMI Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <div id="admin-container" class="container py-5">
    <div id="admin-login-block">
      <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8 col-12">
          <div class="card shadow-lg border-0">
            <div class="card-body p-5">
              <h2 class="fw-bold mb-4 text-primary text-center">Admin belépés</h2>
              <form id="admin-login-form">
                <div class="mb-3">
                  <label class="form-label">Felhasználónév</label>
                  <input type="text" class="form-control" id="admin-username" required autocomplete="username">
                </div>
                <div class="mb-3">
                  <label class="form-label">Jelszó</label>
                  <input type="password" class="form-control" id="admin-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Belépés</button>
                <div id="admin-login-error" class="text-danger mt-3" style="display:none;">Hibás felhasználónév vagy jelszó!</div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="admin-list-block" style="display:none;">
      <div class="admin-list-card card shadow-lg border-0">
        <div class="card-body p-5">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold text-primary text-center mb-0">Kitöltések listája</h2>
            <button id="admin-logout-btn" class="btn btn-outline-danger ms-3">Kilépés</button>
          </div>
          <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle bg-white w-100" style="min-width: 900px;">
              <thead class="table-light">
                <tr>
                  <th>Pályázó iskola neve</th>
                  <th>Dátum</th>
                  <th>Státusz</th>
                  <th>Űrlap</th>
                </tr>
              </thead>
              <tbody id="admin-list-tbody">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Törlés megerősítő modal -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteConfirmModalLabel">Kitöltés törlése</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bezárás"></button>
        </div>
        <div class="modal-body">
          Biztosan törlöd ezt a kitöltést? Ez a művelet nem visszavonható.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégsem</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Igen, törlöm</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
